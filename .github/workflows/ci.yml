# language: YAML, file: .github/workflows/ci.yml, target: GitHub Actions
name: NexaBuild Universal CI

on:
  workflow_dispatch:
    inputs:
      target_lang:
        description: 'Target build architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - nodejs
          - android
          - python
          - go
          - rust
          - cpp
      extra_args:
        description: 'Bypass flags or extra compiler arguments'
        required: false
        type: string

permissions: write-all

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install YAML validator
        run: pip install yamllint
        
      - name: Check JavaScript syntax
        run: npm install -g eslint && eslint js/ || true
        
      - name: Validate dashboard assets and embedding
        # Eksekusi script lokal yang diwajibkan proyek
        run: python tools/validate_project.py

  build:
    needs: validate # Memenuhi aturan wajib: "Job build harus menunggu validasi"
    runs-on: ubuntu-latest
    env:
      TEMP_DIR: ${{ github.workspace }}/temp
      WORKSPACE: ${{ github.workspace }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Web/PWA/JS)
        if: inputs.target_lang == 'nodejs' || inputs.target_lang == 'all'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Build Node.js
        if: inputs.target_lang == 'nodejs' || inputs.target_lang == 'all'
        run: |
          if [ -f package.json ]; then 
            npm install && npm run build ${{ inputs.extra_args }}
          fi

      - name: Setup Java (Android/APK)
        if: inputs.target_lang == 'android' || inputs.target_lang == 'all'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build Android APK
        if: inputs.target_lang == 'android' || inputs.target_lang == 'all'
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease ${{ inputs.extra_args }}
          fi

      - name: Setup Python
        if: inputs.target_lang == 'python' || inputs.target_lang == 'all'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Python
        if: inputs.target_lang == 'python' || inputs.target_lang == 'all'
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f setup.py ]; then python setup.py build ${{ inputs.extra_args }}; fi

      - name: Setup Go
        if: inputs.target_lang == 'go' || inputs.target_lang == 'all'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Go
        if: inputs.target_lang == 'go' || inputs.target_lang == 'all'
        run: |
          if [ -f go.mod ]; then go build -v ${{ inputs.extra_args }} ./...; fi

      - name: Setup Rust
        if: inputs.target_lang == 'rust' || inputs.target_lang == 'all'
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust
        if: inputs.target_lang == 'rust' || inputs.target_lang == 'all'
        run: |
          if [ -f Cargo.toml ]; then cargo build --release ${{ inputs.extra_args }}; fi

      - name: Build C/C++
        if: inputs.target_lang == 'cpp' || inputs.target_lang == 'all'
        run: |
          if [ -f Makefile ]; then 
            make ${{ inputs.extra_args }}
          elif [ -f CMakeLists.txt ]; then 
            mkdir -p build && cd build && cmake .. && make ${{ inputs.extra_args }}
          fi

      - name: Stage & Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexabuild-outputs-${{ github.run_id }}
          path: |
            dist/
            build/
            target/release/
            app/build/outputs/apk/**/*.apk
            *.exe
            *.bin
            *.apk
          retention-days: 7
